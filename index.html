<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Float Int Tool</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">IEEE-754 visual converter</p>
          <h1>Float Toy</h1>
          <p class="intro">
            Toggle bits, edit hexadecimal words, or enter decimal values to inspect
            float16, float32, float64, and x87 float80 representations.
          </p>
        </div>
        <div class="quick-input" aria-label="Set all formats from a decimal value">
          <label for="globalDecimal">Decimal input</label>
          <div class="quick-row">
            <input id="globalDecimal" type="text" inputmode="decimal" value="3.141592653589793">
            <button id="applyGlobal" type="button">Apply</button>
          </div>
        </div>
      </header>

      <section class="toolbar" aria-label="Preset values">
        <button type="button" data-preset="0">0</button>
        <button type="button" data-preset="-0">-0</button>
        <button type="button" data-preset="1">1</button>
        <button type="button" data-preset="-1">-1</button>
        <button type="button" data-preset="3.141592653589793">pi</button>
        <button type="button" data-preset="2.718281828459045">e</button>
        <button type="button" data-preset="Infinity">+inf</button>
        <button type="button" data-preset="-Infinity">-inf</button>
        <button type="button" data-preset="NaN">NaN</button>
      </section>

      <section id="formats" class="formats" aria-live="polite"></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
